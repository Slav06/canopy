# $0 testing profile: Render Free + a separately created Neon Free database.
# No disks or paid databases are provisioned.
services:
  - type: web
    name: canopy-crm
    runtime: node
    region: ohio
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:live
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WORKSPACE_MODE
        value: live
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PRIVATE_UPLOADS_ENABLED
        value: false
      - key: NEXT_PUBLIC_MAPILLARY_ENABLED
        value: false
      - key: LIVE_CALLING_ENABLED
        value: false
      - key: DIALERR_ROLE_BOUNDARY_VERIFIED
        value: false
